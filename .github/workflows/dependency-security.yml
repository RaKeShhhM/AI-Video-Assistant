name: Dependency security and upload regression

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/check-upload-memory.js

  node-audit:
    strategy:
      fail-fast: false
      matrix:
        package: [server, client]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Audit the committed graph, including development dependencies.
      - run: npm audit --package-lock-only --audit-level=low --json > npm-audit.json
      - name: Preserve audit findings even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.package }}
          path: ${{ matrix.package }}/npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the AI service Docker runtime.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install isolated audit tooling
        run: python -m pip install pip-audit==2.10.1
      - name: Resolve and audit the complete requirements graph
        # Do not use --no-deps: requirements have lower bounds, not a lock.
        # --strict fails if a dependency cannot be collected for auditing.
        run: python -m pip_audit -r ai-service/requirements.txt --strict --progress-spinner off --format json --output python-audit.json
      - name: Preserve resolved versions and vulnerability findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit
          path: python-audit.json
          if-no-files-found: warn
          retention-days: 14
