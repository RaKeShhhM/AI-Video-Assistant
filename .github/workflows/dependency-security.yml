name: Dependency security and upload regression

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build

  upload-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/check-upload-memory.js

  node-audit:
    strategy:
      fail-fast: false
      matrix:
        package: [server, client]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Audit the committed graph, including development dependencies.
      - run: npm audit --package-lock-only --audit-level=low --json > npm-audit.json
      - name: Show audit findings in the job log
        if: always()
        run: |
          node -e "const r=JSON.parse(require('fs').readFileSync('npm-audit.json','utf8')); if(r.error) console.error(r.error); console.log(r.metadata?.vulnerabilities); for(const [name,v] of Object.entries(r.vulnerabilities||{})) console.log(name, v.severity, 'affected:', v.range);"
      - name: Preserve audit findings even when the gate fails
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: npm-audit-${{ matrix.package }}
          path: ${{ matrix.package }}/npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Match the AI service Docker runtime.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install isolated audit tooling
        run: python -m pip install pip-audit==2.10.1
      - name: Test the audit policy fails closed
        run: python -m unittest discover -s security/tests -v
      - name: Install reviewed embedded storage dependencies for boundary checks
        run: python -m pip install chromadb==1.5.9 langchain-chroma==1.1.0 langchain-text-splitters
      - name: Verify embedded storage boundaries without models or providers
        working-directory: ai-service
        run: python -m unittest discover -s tests -p test_chroma_boundary.py -v
      - name: Resolve and audit the complete requirements graph
        # Do not use --no-deps: requirements have lower bounds, not a lock.
        # Runs the full strict scan; only approved, unexpired exact matches can pass.
        # The exact Chroma exception is owner-approved and expires on 2026-10-28.
        run: python security/audit_python.py
      - name: Show audit findings in the job log
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path('python-audit.json')
          if not report.exists():
              raise SystemExit('No audit report: inspect the resolution/network error in the previous step.')
          for package in json.loads(report.read_text())['dependencies']:
              for issue in package.get('vulns', []):
                  print(package['name'], package['version'], issue['id'], 'fixed in:', issue['fix_versions'] or 'none listed')
          PY
      - name: Preserve resolved versions and vulnerability findings
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: python-audit
          path: python-audit.json
          if-no-files-found: warn
          retention-days: 14
