version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build: ./ai-service
    ports:
      - "127.0.0.1:8000:8000" # local debugging only; gateway uses the private Compose network
    env_file:
      - ./ai-service/.env
    environment:
      - EXPRESS_INTERNAL_URL=http://server:5000
    volumes:
      - ./ai-service:/app

  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/ai-video-assistant
      - AI_SERVICE_URL=http://ai-service:8000
      - SELF_URL=http://server:5000
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      - mongo
      - ai-service

  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./client:/app
    depends_on:
      - server

volumes:
  mongo_data:
